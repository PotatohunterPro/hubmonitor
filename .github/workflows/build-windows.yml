name: build-windows-installer

# Gera o HUBMonitor-Setup.exe em um runner Windows hospedado.
# Nao requer nenhuma maquina Windows local.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Testes
        shell: powershell
        run: python -m pytest tests -q

      - name: NSIS
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Build do instalador
        shell: powershell
        run: ./packaging/build_windows.ps1 -Version "1.0.0"

      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: HUBMonitor-Setup-1.0.0
          if-no-files-found: error
          path: |
            dist/HUBMonitor-Setup.exe
            dist/BUILD-INFO.json
