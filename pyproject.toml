[project]
name = "hub-monitoramento"
version = "1.0.0"
description = "Monitoramento operacional de caixas e conectividade para lojas de varejo"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "build", "dist", ".python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
